name: Set up ja
description: Add the ja and jig native toolchain to a Zulu JDK

inputs:
  ja-version:
    description: Ja version; defaults to the version in the action tag
    required: false

outputs:
  java-home:
    description: Linked ja toolchain JDK
    value: ${{ steps.configuration.outputs.java-home }}

runs:
  using: composite
  steps:
    - name: Configure ja toolchain
      id: configuration
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
        REQUESTED_JA_VERSION: ${{ inputs.ja-version }}
      run: |
        if [[ -n "$REQUESTED_JA_VERSION" ]]; then
          ja_version="$REQUESTED_JA_VERSION"
        elif [[ "$ACTION_REF" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?)$ ]]; then
          ja_version="${BASH_REMATCH[1]}"
        else
          echo "ja-version is required when the action is not referenced by a version tag" >&2
          exit 2
        fi
        if command -v sha256sum >/dev/null; then
          fingerprint="$(sha256sum "$JAVA_HOME/release" | cut -d' ' -f1)"
        else
          fingerprint="$(shasum -a 256 "$JAVA_HOME/release" | cut -d' ' -f1)"
        fi
        java_home="$RUNNER_TOOL_CACHE/ja/$fingerprint/$ja_version"
        echo "ja-version=$ja_version" >> "$GITHUB_OUTPUT"
        echo "java-home=$java_home" >> "$GITHUB_OUTPUT"
        echo "cache-key=ja-toolchain-v2-${RUNNER_OS}-${RUNNER_ARCH}-${fingerprint}-${ja_version}" >> "$GITHUB_OUTPUT"

    - name: Restore ja toolchain
      id: cache
      uses: actions/cache@v5
      with:
        path: ${{ steps.configuration.outputs.java-home }}
        key: ${{ steps.configuration.outputs.cache-key }}

    - name: Link ja toolchain
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: >-
        "$GITHUB_ACTION_PATH/link.sh"
        "$JAVA_HOME"
        "${{ steps.configuration.outputs.java-home }}"
        "${{ steps.configuration.outputs.ja-version }}"

    - name: Select ja toolchain
      shell: bash
      env:
        JA_JAVA_HOME: ${{ steps.configuration.outputs.java-home }}
      run: |
        echo "JAVA_HOME=$JA_JAVA_HOME" >> "$GITHUB_ENV"
        echo "$JA_JAVA_HOME/bin" >> "$GITHUB_PATH"
