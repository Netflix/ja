name: Link assembled tool
description: Replace a bundled tool with its assembled JMOD in the current Ja toolchain

inputs:
  artifacts:
    description: Directory containing artifacts produced by ja assemble --jmod
    required: true
  module:
    description: Java module to replace
    required: true

outputs:
  java-home:
    description: Linked development JDK containing the assembled tool
    value: ${{ steps.configuration.outputs.java-home }}

runs:
  using: composite
  steps:
    - name: Configure linked toolchain
      id: configuration
      shell: bash
      env:
        MODULE: ${{ inputs.module }}
      run: echo "java-home=$RUNNER_TEMP/ja-built-$MODULE" >> "$GITHUB_OUTPUT"

    - name: Link assembled tool
      shell: bash
      run: >-
        "$GITHUB_ACTION_PATH/link.sh"
        "$JAVA_HOME"
        "${{ inputs.artifacts }}"
        "${{ inputs.module }}"
        "${{ steps.configuration.outputs.java-home }}"

    - name: Select linked toolchain
      shell: bash
      env:
        BUILT_JAVA_HOME: ${{ steps.configuration.outputs.java-home }}
      run: |
        echo "JAVA_HOME=$BUILT_JAVA_HOME" >> "$GITHUB_ENV"
        echo "$BUILT_JAVA_HOME/bin" >> "$GITHUB_PATH"
