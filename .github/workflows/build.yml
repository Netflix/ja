name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      BOOTSTRAP_JA_VERSION: 0.17.4
      BUILD_VERSION: 0.17.4-build.${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Zulu JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version-file: .java-version

      - name: Configure build
        run: |
          echo "BOOTSTRAP_JAVA_HOME=$RUNNER_TEMP/ja-bootstrap" >> "$GITHUB_ENV"
          echo "BUILT_JAVA_HOME=$RUNNER_TEMP/ja-built" >> "$GITHUB_ENV"

      - name: Link bootstrap ja development JDK
        run: |
          .github/scripts/link-ja-development-jdk.sh \
            "$JAVA_HOME" \
            "$BOOTSTRAP_JAVA_HOME" \
            "$BOOTSTRAP_JA_VERSION"
          echo "$BOOTSTRAP_JAVA_HOME/bin" >> "$GITHUB_PATH"

      - name: Build native launchers with Zig
        run: src/launcher/build.sh

      - name: Test source with bootstrap ja
        run: ja test --all

      - name: Build ja with bootstrap ja
        run: ja maven install --module-version "$BUILD_VERSION"

      - name: Link built ja development JDK
        run: |
          .github/scripts/link-ja-development-jdk.sh \
            "$JAVA_HOME" \
            "$BUILT_JAVA_HOME" \
            "$BUILD_VERSION"
          echo "$BUILT_JAVA_HOME/bin" >> "$GITHUB_PATH"

      - name: Test source with built ja
        run: ja test --all
