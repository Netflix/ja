name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Resolve bootstrap ja version
    runs-on: ubuntu-latest
    outputs:
      ja-version: ${{ steps.ja.outputs.ja-version }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up bootstrap JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version-file: .java-version

      - name: Set up bootstrap ja
        id: ja
        uses: ./.github/actions/setup-ja
        with:
          ja-version: 0.20.0

  install:
    name: Install (${{ matrix.name }})
    needs: bootstrap
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS JMOD
            os: macos-latest
            distribution: zulu
            link_mode: jmods
            vm: HotSpot
          - name: Linux JMOD
            os: ubuntu-latest
            distribution: zulu
            link_mode: jmods
            vm: HotSpot
          - name: Linux linkable runtime
            os: ubuntu-latest
            distribution: temurin
            link_mode: linkable
            vm: HotSpot
          - name: Linux OpenJ9
            os: ubuntu-latest
            distribution: semeru
            link_mode: jmods
            vm: OpenJ9
          - name: Windows JMOD
            os: windows-latest
            distribution: zulu
            link_mode: jmods
            vm: HotSpot
    steps:
      - uses: actions/checkout@v6

      - name: Set up source JDK
        uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.distribution }}
          java-version-file: .java-version

      - name: Remove JMODs from linkable runtime
        if: matrix.link_mode == 'linkable'
        run: |
          jlink_help="$("$JAVA_HOME/bin/jlink" --help 2>&1)"
          grep -Fq "Linking from run-time image enabled" <<< "$jlink_help"
          if [[ -d "$JAVA_HOME/jmods" ]]; then
            mv "$JAVA_HOME/jmods" "$RUNNER_TEMP/source-jmods"
          fi

      - name: Test installer and installed ja
        if: runner.os != 'Windows'
        env:
          EXPECTED_JAVA_VM: ${{ matrix.vm }}
          EXPECTED_LINK_MODE: ${{ matrix.link_mode }}
        run: >-
          .github/scripts/test-install.sh
          "${{ needs.bootstrap.outputs.ja-version }}"

      - name: Test PowerShell installer and installed ja
        if: runner.os == 'Windows'
        env:
          EXPECTED_JAVA_VM: ${{ matrix.vm }}
          EXPECTED_LINK_MODE: ${{ matrix.link_mode }}
        run: >-
          ./.github/scripts/test-install.ps1
          -JaVersion "${{ needs.bootstrap.outputs.ja-version }}"

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      BUILD_VERSION: 0.18.1-build.${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Zulu JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version-file: .java-version

      - name: Configure build
        run: |
          echo "SOURCE_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "BUILT_JAVA_HOME=$RUNNER_TEMP/ja-built" >> "$GITHUB_ENV"

      - name: Set up bootstrap ja
        uses: Netflix/ja/.github/actions/setup-ja@v0.21.1

      - name: Build native launchers with Zig
        run: src/launcher/build.sh

      - name: Build ja distribution with bootstrap ja
        run: ja maven install --module-version "$BUILD_VERSION"

      - name: Link built ja development JDK
        run: |
          .github/scripts/link-ja-development-jdk.sh \
            "$SOURCE_JAVA_HOME" \
            "$BUILT_JAVA_HOME" \
            "$BUILD_VERSION"
          echo "JAVA_HOME=$BUILT_JAVA_HOME" >> "$GITHUB_ENV"
          echo "$BUILT_JAVA_HOME/bin" >> "$GITHUB_PATH"

      - name: Test source with built ja
        run: ja test --all
