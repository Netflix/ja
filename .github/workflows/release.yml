name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: read

jobs:
  release:
    name: Release
    if: ${{ github.repository == 'Netflix/ja' }}
    environment: Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Zulu JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version-file: .java-version

      - name: Configure release
        run: |
          echo "SOURCE_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "BUILT_JAVA_HOME=$RUNNER_TEMP/ja-built" >> "$GITHUB_ENV"

      - name: Set up bootstrap ja
        uses: Netflix/ja/.github/actions/setup-ja@v0.18.7

      - name: Build native launchers with Zig
        run: src/launcher/build.sh

      - name: Build ja distribution with bootstrap ja
        run: ja maven install --module-version "$BUILD_VERSION"

      - name: Link built ja development JDK
        run: |
          .github/scripts/link-ja-development-jdk.sh \
            "$SOURCE_JAVA_HOME" \
            "$BUILT_JAVA_HOME" \
            "$BUILD_VERSION"
          echo "JAVA_HOME=$BUILT_JAVA_HOME" >> "$GITHUB_ENV"
          echo "$BUILT_JAVA_HOME/bin" >> "$GITHUB_PATH"

      - name: Test source with built ja
        run: ja test --all

      - name: Publish to Maven Central with built ja
        run: >-
          ja maven deploy-central
          --module-version "$BUILD_VERSION"
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.ORG_SONATYPE_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.ORG_SONATYPE_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.ORG_SIGNING_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.ORG_SIGNING_PASSWORD }}
